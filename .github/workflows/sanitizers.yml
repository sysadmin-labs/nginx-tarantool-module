name: A/UBSan

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Monday morning, so a new nginx release that breaks the module shows
    # up here and not in somebody's build
    - cron: '7 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitizers:
    name: address and undefined behaviour
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # nginx runs the little programs its configure compiles.  With leak
      # detection on, each of them reports at exit and returns non-zero,
      # and every feature probe comes out "found but is not working".
      # log_path, because nginx redirects stderr onto its error log
      # file and a report on stderr would be lost there; see the
      # findings step below.
      ASAN_OPTIONS: detect_leaks=0:log_path=${{ github.workspace }}/sanlog/asan
      # The suppression file names one finding in nginx's own startup
      # path and says why; see ci/ubsan.suppress.  The path has to be
      # absolute, the suite runs nginx from a directory of its own.
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0:suppressions=${{ github.workspace }}/ci/ubsan.suppress:log_path=${{ github.workspace }}/sanlog/ubsan
      # -DNGX_DEBUG_PALLOC=1 is what makes this run able to see the
      # thing it is for.  Without it ngx_palloc and ngx_pnalloc hand
      # out slices of a pool block, so a write one byte past an
      # allocation lands inside a block ASan handed over whole and no
      # report is made; nginx keeps a switch for exactly this and sends
      # every allocation straight to malloc when it is set.
      CI_CC_OPT: '-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 -DNGX_DEBUG_PALLOC=1'
      CI_LD_OPT: '-fsanitize=address,undefined'

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build msgpuck, which apt does not have
        run: ci/msgpuck.sh

      - name: Build nginx with both sanitizers
        run: |
          . .github/versions.env
          ci/build.sh "$NGINX_VERSION" "$HOME/nginx"

      - name: Run the test suite under the sanitizers
        run: |
          set -o pipefail
          mkdir -p sanlog
          ASAN_OPTIONS="$ASAN_OPTIONS:abort_on_error=0" \
            TEST_NGINX_NO_SHUFFLE=1 \
            TEST_NGINX_BINARY="$HOME/nginx/sbin/nginx" \
            prove -r t/ 2>&1 | tee sanitizer.log


      - name: No findings allowed
        run: |
          # The sanitizers write to log_path, not to stderr.  nginx
          # redirects its own stderr onto the error log file as soon as
          # error_log names one (ngx_log_redirect_stderr), and Test::Nginx
          # always names one, so a grep over the suite's stdout saw ASan
          # only indirectly -- through the worker dying -- and missed every
          # UBSan report outright: halt_on_error=0 keeps the process
          # alive, and "runtime error:" carries none of the [alert],
          # [crit] or [emerg] that Test::Nginx looks for.  With log_path
          # the reports land in files of their own, and a sanitizer
          # creates such a file only when it has something to say, so the
          # existence of one is the finding.
          found=0
          if grep -nE "AddressSanitizer|runtime error:|LeakSanitizer" sanitizer.log; then
            found=1
          fi
          for f in sanlog/*; do
            [ -e "$f" ] || continue
            echo "--- $f ---"
            cat "$f"
            found=1
          done
          if [ "$found" != 0 ]; then
            echo "a sanitizer reported the lines above" >&2
            exit 1
          fi
          echo "the sanitizers found nothing"
